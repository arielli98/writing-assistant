<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公文写作助手</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont;
  display: flex;
  height: 100vh;
}

/* 左侧 */
.sidebar {
  width: 260px;
  background: #f5f5f5;
  padding: 20px;
}

.sidebar h3 {
  margin-top: 0;
}

.quick-btn {
  background: white;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  cursor: pointer;
}

/* 主区 */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.msg {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 60%;
}

.user {
  background: #007aff;
  color: white;
  margin-left: auto;
}

.bot {
  background: #eee;
}

/* 输入区 */
.input-box {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
}

textarea {
  flex: 1;
  padding: 10px;
  height: 60px;
}

button {
  margin-left: 10px;
  padding: 10px 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 左侧 -->
<div class="sidebar">
  <h3>快捷功能</h3>
  <div class="quick-btn" onclick="quick('写一份年度工作报告')">年度报告</div>
  <div class="quick-btn" onclick="quick('写一份会议通知')">会议通知</div>
  <div class="quick-btn" onclick="quick('写一份工作总结')">工作总结</div>
</div>

<!-- 主区 -->
<div class="main">
  <div id="chat" class="chat"></div>

  <div class="input-box">
    <textarea id="input" placeholder="请输入你的需求..."></textarea>
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");

// ✅ 在这里填你的信息
const API_KEY = "pat_2BmbXYicb21RZAu0epzksVagjcSJnIXFXYCt7a9aOJEnOpK6Yp8GBXgL9q7l3Fnm";
const BOT_ID = "7628532944344563752";

// 添加消息
function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// 快捷按钮
function quick(text) {
  document.getElementById("input").value = text;
}

// 发送消息
async function send() {
  const text = document.getElementById("input").value;
  if (!text) return;

  addMsg(text, "user");

  const loading = document.createElement("div");
  loading.className = "msg bot";
  loading.innerText = "正在生成...";
  chat.appendChild(loading);

  try {
    const res = await fetch("https://api.coze.com/open_api/v2/chat", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        bot_id: BOT_ID,
        user: "user_001",
        query: text
      })
    });

    const data = await res.json();

    let reply = "暂无回复";
    if (data.messages && data.messages.length > 0) {
      reply = data.messages[0].content;
    }

    loading.innerText = reply;

  } catch (err) {
    loading.innerText = "请求失败，请检查API配置";
  }
}
</script>

</body>
</html>
