<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公文写作助手</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont;
  display: flex;
  height: 100vh;
  background: #f2f3f5;
}

/* 左侧 */
.sidebar {
  width: 260px;
  background: white;
  padding: 20px;
  border-right: 1px solid #eee;
}

.sidebar h3 {
  margin-top: 0;
}

.quick-btn {
  background: #f5f5f5;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.quick-btn:hover {
  background: #eaeaea;
}

/* 主区 */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* 聊天区 */
.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.msg {
  margin: 10px 0;
  padding: 12px;
  border-radius: 12px;
  max-width: 60%;
  line-height: 1.5;
}

.user {
  background: #007aff;
  color: white;
  margin-left: auto;
}

.bot {
  background: white;
  border: 1px solid #eee;
}

/* 输入区 */
.input-box {
  display: flex;
  padding: 15px;
  border-top: 1px solid #ddd;
  background: white;
}

textarea {
  flex: 1;
  padding: 10px;
  height: 60px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-left: 10px;
  padding: 10px 20px;
  border: none;
  background: #007aff;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<!-- 左侧 -->
<div class="sidebar">
  <h3>快捷功能</h3>
  <div class="quick-btn" onclick="quick('写一份年度工作报告')">年度报告</div>
  <div class="quick-btn" onclick="quick('写一份会议通知')">会议通知</div>
  <div class="quick-btn" onclick="quick('写一份工作总结')">工作总结</div>
</div>

<!-- 主区 -->
<div class="main">
  <div id="chat" class="chat"></div>

  <div class="input-box">
    <textarea id="input" placeholder="请输入你的需求..."></textarea>
    <button id="sendBtn">发送</button>
</div>

<script>
const chat = document.getElementById("chat");

// 添加消息
function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// 快捷按钮
function quick(text) {
  document.getElementById("input").value = text;
}

// 发送消息
async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "msg bot";
  loading.innerText = "正在生成...";
  chat.appendChild(loading);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    loading.innerText = data.reply || "暂无回复";

  } catch (err) {
    loading.innerText = "请求失败（后端未部署或报错）";
  }
}
  document.getElementById("sendBtn").addEventListener("click", send);
</script>

</body>
</html>
