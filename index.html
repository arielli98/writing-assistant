<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公文写作助手</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 260px;
  background: #f5f5f5;
  padding: 20px;
}

.quick-btn {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}
.quick-btn:hover {
  background: #eaeaea;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.msg {
  margin: 10px 0;
  padding: 12px;
  border-radius: 12px;
  max-width: 60%;
  line-height: 1.6;
}

.user {
  background: #007aff;
  color: white;
  margin-left: auto;
}

.bot {
  background: #eee;
}

.input-box {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
}

textarea {
  flex: 1;
  padding: 10px;
  height: 60px;
  border-radius: 8px;
}

button {
  margin-left: 10px;
  padding: 10px 20px;
  cursor: pointer;
  border-radius: 8px;
  background: #007aff;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>快捷功能</h3>
  <div class="quick-btn" onclick="quick('写一份年度工作报告')">年度报告</div>
  <div class="quick-btn" onclick="quick('写一份会议通知')">会议通知</div>
  <div class="quick-btn" onclick="quick('写一份工作总结')">工作总结</div>
</div>

<div class="main">
  <div id="chat" class="chat"></div>

  <div class="input-box">
    <textarea id="input" placeholder="请输入你的需求..."></textarea>
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");

// ⚠️ 这里填你的
const API_KEY = "pat_2BmbXYicb21RZAu0epzksVagjcSJnIXFXYCt7a9aOJEnOpK6Yp8GBXgL9q7l3Fnm";
const BOT_ID = "7628532944344563752";

// 添加消息
function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quick(text) {
  document.getElementById("input").value = text;
}

async function send() {
  const text = document.getElementById("input").value;
  if (!text) return;

  addMsg(text, "user");

  const loading = document.createElement("div");
  loading.className = "msg bot";
  loading.innerText = "正在生成...";
  chat.appendChild(loading);

  try {
    console.log("开始请求API...");

    const res = await fetch("https://api.coze.com/open_api/v2/chat", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        bot_id: BOT_ID,
        user: "user_001",
        query: text,
        stream: false
      })
    });

    console.log("响应状态:", res.status);

    const data = await res.json();
    console.log("返回数据:", data);

    let reply = "⚠️ 未获取到回复";

    // ✅ 更稳的解析方式
    if (data?.messages?.length) {
      const answerMsg = data.messages.find(m => m.type === "answer");
      if (answerMsg?.content) {
        reply = answerMsg.content;
      }
    }

    loading.innerText = reply;

  } catch (err) {
    console.error("请求错误:", err);
    loading.innerText = "❌ 请求失败（大概率是被浏览器拦截或KEY问题）";
  }
}
</script>

</body>
</html>
