<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公文写作助手</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f5f7fb;
}

/* 顶部 */
.header {
    height: 60px;
    background: #1e2a38;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 18px;
}

/* 布局 */
.container {
    display: flex;
    height: calc(100vh - 60px);
}

/* 功能区 */
.sidebar {
    width: 260px;
    background: white;
    border-right: 1px solid #ddd;
    padding: 20px;
}

.sidebar h3 {
    margin-top: 0;
}

.quick-btn {
    display: block;
    margin-bottom: 10px;
    padding: 10px;
    background: #eef3ff;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    text-align: left;
}

.quick-btn:hover {
    background: #dbe6ff;
}

/* 对话区 */
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 15px;
    display: flex;
}

.message.ai {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 60%;
    padding: 12px;
    border-radius: 10px;
}

.ai .bubble {
    background: #e9eef6;
}

.user .bubble {
    background: #4a90e2;
    color: white;
}

.timestamp {
    font-size: 10px;
    color: #999;
    margin-top: 5px;
}

/* 输入区 */
.input-area {
    border-top: 1px solid #ddd;
    padding: 15px;
    display: flex;
    gap: 10px;
}

textarea {
    flex: 1;
    resize: none;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button.send {
    background: #4a90e2;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
}

/* 状态 */
.typing {
    font-size: 12px;
    color: #888;
    margin-left: 10px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% {opacity: 0.3;}
    50% {opacity: 1;}
    100% {opacity: 0.3;}
}

/* 页脚 */
.footer {
    text-align: center;
    font-size: 12px;
    padding: 10px;
    background: #f0f0f0;
}
</style>
</head>

<body>

<div class="header">
    公文写作助手
</div>

<div class="container">

    <!-- 功能区 -->
    <div class="sidebar">
        <h3>功能区</h3>

        <button class="quick-btn" onclick="quickPrompt('撰写一份年度工作报告')">
            📄 年度工作报告
        </button>

        <button class="quick-btn" onclick="quickPrompt('写一份会议纪要')">
            📝 会议纪要
        </button>

        <button class="quick-btn" onclick="quickPrompt('生成一份通知公告')">
            📢 通知公告
        </button>

        <button class="quick-btn" onclick="newChat()">
            ➕ 新建对话
        </button>
    </div>

    <!-- 对话区 -->
    <div class="chat-area">
        <div class="messages" id="messages"></div>

        <!-- 输入区 -->
        <div class="input-area">
            <textarea id="input" rows="2" placeholder="请输入你的指令..."></textarea>
            <button class="send" onclick="sendMessage()">发送</button>
        </div>
    </div>
</div>

<div class="footer">
    © 2026 公文助手 | 本地 MVP 版本
</div>

<script>
const messages = document.getElementById('messages');

function addMessage(text, type) {
    const msg = document.createElement('div');
    msg.className = 'message ' + type;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerText = text;

    msg.appendChild(bubble);

    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';

    showTyping();

    setTimeout(() => {
        removeTyping();
        addMessage(generateFakeReply(text), 'ai');
    }, 1200);
}

function quickPrompt(text) {
    document.getElementById('input').value = text;
}

function newChat() {
    messages.innerHTML = '';
}

function showTyping() {
    const typing = document.createElement('div');
    typing.id = 'typing';
    typing.className = 'typing';
    typing.innerText = 'AI 正在输入...';
    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
}

function generateFakeReply(input) {
    return "已根据你的需求生成初稿：\n\n【" + input + "】\n\n（这里是模拟AI生成内容，后续可接入真实API）";
}
</script>

</body>
</html>
